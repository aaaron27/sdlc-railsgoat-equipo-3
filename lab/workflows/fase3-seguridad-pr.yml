name: Fase 3 · Seguridad en PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  sast:
    name: SAST con Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar Semgrep CE
        run: pip install semgrep==1.182.0
      - name: Probar las reglas propias
        run: semgrep --test seguridad/fase-3/semgrep
      - name: Escanear app/ con p/default y las reglas propias
        run: |
          mkdir -p reportes
          semgrep scan app --config p/default --config seguridad/fase-3/semgrep \
            --metrics off --sarif --output reportes/semgrep.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-semgrep
          path: reportes/

  secretos:
    name: Secretos con Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Buscar secretos en todo el historial
        run: |
          mkdir -p reportes
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect \
            --source /repo \
            --report-format sarif \
            --report-path /repo/reportes/gitleaks.sarif \
            --redact \
            --exit-code 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-gitleaks
          path: reportes/

  dependencias:
    name: Dependencias nuevas con Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Revisar vulnerabilidades en dependencias del PR
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          warn-only: true
